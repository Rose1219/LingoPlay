# ============================================================================
# 本地验证专用 profile（勿用于生产）
# 激活方式：mvn -Plocal spring-boot:run  （或设 SPRING_PROFILES_ACTIVE=local）
# 使用 H2 内存库替代 MySQL，无需本地数据库即可跑通全站与新增功能。
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:lingolearn;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 本地验证：真实支付凭证未配置，渠道应自动隐藏；
# 演示支付开启，便于在 Web/小程序端走通「开通 VIP → 方言解锁」完整流程。
# 生产环境务必保持 false（application.yml 默认值）。
pay:
  mock-enabled: true

# 发音服务：本地不接付费云 TTS，走有道免费端点（需外网）；
# 放开配额避免验证时被限流。
tts:
  daily-quota: 0
  rate-limit-per-minute: 120
